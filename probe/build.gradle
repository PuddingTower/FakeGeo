plugins { id 'com.android.application' }
def localSettings = new Properties()
def localSettingsFile = rootProject.file('local.properties')
if (localSettingsFile.exists()) localSettingsFile.withInputStream { localSettings.load(it) }
android {
    namespace 'io.github.fakegeo.probe'
    compileSdk 35
    // Match the affected client's legacy Wi-Fi permission path, rather than testing only modern clients.
    defaultConfig { applicationId 'io.github.fakegeo.probe'; minSdk 29; targetSdk 30; versionCode 4; versionName '0.2.2' }
    lint { disable 'ExpiredTargetSdkVersion' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            if (localSettings.getProperty('fakegeo.debug.keystore')) storeFile file(localSettings.getProperty('fakegeo.debug.keystore'))
        }
    }
}
dependencies { implementation 'com.google.android.gms:play-services-location:21.3.0' }
